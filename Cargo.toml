[workspace]
members = [
    "iris-core",
    "iris-nn",
    "iris-transformers",
    "iris-sm87",
    "iris-sm87/kernels",
    "iris-sm87/flash-attn/fa-v1",
    "docs",
]
exclude = [
    "iris-examples",
    "iris-sm87/flash-attn/fa-v3",
]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2021"
description = "Low-latency SM87 vision-language inference runtime."
repository = "https://github.com/fern-robotics/iris"
keywords = ["cuda", "vision-language-model", "inference", "jetson"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
accelerate-src = { version = "0.3.2" }
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1.4.3"
clap = { version = "4.2.4", features = ["derive"] }
criterion = { version = "0.8", default-features = false }
cudarc = { version = "0.19.8", features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-linking",
], default-features = false }
fancy-regex = "0.18.0"
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
hf-hub = "0.5.0"
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
iris-core = { path = "./iris-core", package = "iris-core", version = "0.11.0" }
iris-flash-attn = { path = "./iris-sm87/flash-attn/fa-v1", version = "0.11.0" }
iris-kernels = { path = "./iris-sm87/kernels", version = "0.11.0" }
iris-nn = { path = "./iris-nn", version = "0.11.0" }
iris-transformers = { path = "./iris-transformers", version = "0.11.0" }
libc = "0.2.147"
libm = "0.2.15"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num_cpus = "1.15.0"
num-traits = "0.2.15"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
serde_plain = "1.0.2"
thiserror = "2"
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tracing = "0.1.37"
yoke = { version = "0.8.1", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "8.6.0", default-features = false }

[profile.release-with-debug]
inherits = "release"
debug = true
