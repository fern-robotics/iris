[package]
name = "iris-examples"
version.workspace = true
edition.workspace = true
description = "Focused runnable inference baselines for Iris."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hf-hub = { workspace = true, features = ["tokio"] }
image.workspace = true
iris-core.workspace = true
iris-nn.workspace = true
iris-transformers.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, features = ["onig"] }
tracing.workspace = true
tracing-chrome = "0.7"
tracing-subscriber = "0.3"

[features]
default = []
cuda = ["iris-core/cuda", "iris-nn/cuda", "iris-transformers/cuda"]
flash-attn = ["cuda", "iris-transformers/flash-attn"]
cudnn = ["cuda", "iris-core/cudnn", "iris-nn/cudnn", "iris-transformers/cudnn"]
