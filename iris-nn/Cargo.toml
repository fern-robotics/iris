[package]
name = "iris-nn"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
iris-core = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "iris-core/accelerate"]
cuda = ["iris-core/cuda"]
cudnn = ["iris-core/cudnn"]
mkl = ["dep:intel-mkl-src", "iris-core/mkl"]
# Unsupported in this SM87-focused fork; retained for cfg compatibility only.
metal = []

[[bench]]
name = "bench_main"
harness = false
