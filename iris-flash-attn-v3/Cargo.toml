[package]
name = "iris-flash-attn-v3"
version = "0.11.0"
edition = "2021"

description = "Flash attention v3 layer for the iris-core ML framework."
repository = "https://github.com/fern-robotics/iris"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["cutlass/docs/**", "cutlass/test/**", "cutlass/examples/**", "cutlass/tools/**", "cutlass/media/**"]

[dependencies]
iris-core = { path = "../iris-core", features = ["cuda"], package = "iris-core", version = "0.11.0" }
half = { version = "2.3.1", features = ["num-traits"] }

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
num_cpus = "1.15.0"
rayon = "1.7.0"
cudaforge = "0.1"

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
iris-nn = { path = "../iris-nn", features = ["cuda"] }
rstest = "0.23"
