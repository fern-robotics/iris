[package]
name = "iris-transformers"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
iris-core = { workspace = true }
iris-flash-attn = { workspace = true, optional = true }
iris-nn = { workspace = true }
fancy-regex = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_plain = { workspace = true }
tracing = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "iris-core/accelerate", "iris-nn/accelerate"]
cuda = ["iris-core/cuda", "iris-nn/cuda"]
cudnn = ["iris-core/cudnn", "iris-nn/cudnn"]
flash-attn = ["cuda", "dep:iris-flash-attn"]
mkl = ["dep:intel-mkl-src", "iris-core/mkl", "iris-nn/mkl"]
metal = ["iris-core/metal", "iris-nn/metal"]
metal-debug-labels = ["metal", "iris-core/metal-debug-labels", "iris-nn/metal-debug-labels"]
