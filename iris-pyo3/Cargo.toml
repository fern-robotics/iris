[package]
name = "iris-pyo3"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[lib]
name = "iris"
crate-type = ["cdylib"]

[dependencies]
accelerate-src = { workspace = true, optional = true }
iris-core = { workspace = true }
iris-nn = { workspace = true }
iris-onnx = { workspace = true, optional = true }
half = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py313"] }
float8 = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.29"

[features]
default = []
accelerate = ["dep:accelerate-src", "iris-core/accelerate"]
cuda = ["iris-core/cuda"]
mkl = ["dep:intel-mkl-src", "iris-core/mkl"]
onnx = ["dep:iris-onnx"]
